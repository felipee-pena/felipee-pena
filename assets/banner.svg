<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="halo" cx="0.18" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#halo)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#30363d"/>

  <!-- left: identity -->
  <text x="64" y="78" font-size="18" fill="#7d8590">// olá, mundo</text>
  <text x="62" y="134" font-size="52" font-weight="700" fill="#e6edf3" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Felipe Pena</text>
  <rect x="64" y="152" width="300" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
  <text x="64" y="192" font-size="20" fill="#22d3ee">Desenvolvedor Java em formação</text>
  <text x="64" y="222" font-size="16" fill="#8b949e">APIs REST · Spring Boot · Arquitetura de Software</text>

  <!-- right: code card -->
  <g transform="translate(700,36)">
    <rect width="440" height="190" rx="12" fill="#0b1220" fill-opacity="0.85" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle cx="22" cy="20" r="5" fill="#f87171" fill-opacity="0.8"/>
    <circle cx="40" cy="20" r="5" fill="#facc15" fill-opacity="0.8"/>
    <circle cx="58" cy="20" r="5" fill="#34d399" fill-opacity="0.8"/>
    <text x="24" y="62" font-size="16"><tspan fill="#ff7b72">while</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#79c0ff">aprendendo</tspan><tspan fill="#e6edf3">) {</tspan></text>
    <text x="52" y="92" font-size="16"><tspan fill="#d2a8ff">estudar</tspan><tspan fill="#e6edf3">();</tspan></text>
    <text x="52" y="120" font-size="16"><tspan fill="#d2a8ff">construir</tspan><tspan fill="#e6edf3">();</tspan></text>
    <text x="52" y="148" font-size="16"><tspan fill="#d2a8ff">entregar</tspan><tspan fill="#e6edf3">();</tspan><tspan fill="#7d8590">  // com testes</tspan></text>
    <text x="24" y="174" font-size="16" fill="#e6edf3">}</text>
  </g>
</svg>
